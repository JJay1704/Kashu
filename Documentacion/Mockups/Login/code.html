<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kashu - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#45464d",
                        "outline": "#76777d",
                        "on-tertiary-fixed": "#40000d",
                        "on-tertiary-fixed-variant": "#92002a",
                        "on-primary-container": "#7c839b",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#4edea3",
                        "primary-container": "#131b2e",
                        "secondary-container": "#6cf8bb",
                        "surface-container": "#e5eeff",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed-dim": "#bec6e0",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#bec6e0",
                        "on-error-container": "#93000a",
                        "on-background": "#0b1c30",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "on-secondary-container": "#00714d",
                        "surface-tint": "#565e74",
                        "primary": "#000000",
                        "on-primary-fixed": "#131b2e",
                        "tertiary-container": "#40000d",
                        "tertiary-fixed": "#ffdadb",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "surface-dim": "#cbdbf5",
                        "secondary": "#006c49",
                        "tertiary": "#000000",
                        "surface-container-highest": "#d3e4fe",
                        "surface-variant": "#d3e4fe",
                        "inverse-surface": "#213145",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "surface": "#f8f9ff",
                        "outline-variant": "#c6c6cd",
                        "primary-fixed": "#dae2fd",
                        "on-secondary-fixed": "#002113",
                        "on-surface": "#0b1c30",
                        "secondary-fixed": "#6ffbbe",
                        "on-secondary-fixed-variant": "#005236",
                        "on-tertiary-container": "#f23d5c",
                        "surface-bright": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "background": "#f8f9ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "container-max-width": "1200px",
                        "unit": "8px",
                        "stack-md": "16px",
                        "stack-sm": "8px",
                        "gutter": "24px",
                        "margin-desktop": "40px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "numeric-md": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "numeric-xl": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "numeric-md": ["16px", { "lineHeight": "1", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "numeric-xl": ["36px", { "lineHeight": "1", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .input-floating:focus-within label {
            transform: translateY(-50%) scale(0.85);
            top: 0;
            background-color: white;
            padding: 0 4px;
        }
        .input-floating input:not(:placeholder-shown) + label {
            transform: translateY(-50%) scale(0.85);
            top: 0;
            background-color: white;
            padding: 0 4px;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Login Container -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-[0px_10px_15px_-3px_rgba(15,23,42,0.1)] border border-outline-variant p-8 relative overflow-hidden">
<!-- Subtle background accent -->
<div class="absolute top-0 right-0 -mr-16 -mt-16 w-48 h-48 bg-surface-container-high rounded-full blur-3xl opacity-50 pointer-events-none"></div>
<!-- Header -->
<header class="text-center mb-8 relative z-10">
<h1 class="font-display-lg text-display-lg text-primary mb-2">Kashu</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to your financial dashboard.</p>
</header>
<!-- Form -->
<form class="space-y-6 relative z-10">
<!-- Email Input -->
<div class="relative input-floating">
<input class="peer w-full h-14 bg-transparent border border-outline rounded-lg px-4 text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-transparent" id="email" name="email" placeholder="Email Address" required="" type="email"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md text-body-md transition-all duration-200 pointer-events-none" for="email">Email Address</label>
</div>
<!-- Password Input -->
<div class="relative input-floating">
<input class="peer w-full h-14 bg-transparent border border-outline rounded-lg px-4 text-on-surface font-body-md text-body-md focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder-transparent" id="password" name="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-md text-body-md transition-all duration-200 pointer-events-none" for="password">Password</label>
</div>
<!-- Actions -->
<div class="flex items-center justify-between pt-2">
<a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-2" type="submit">
                Log In
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<footer class="mt-8 text-center relative z-10">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account? 
                <a class="text-primary font-label-md text-label-md hover:underline" href="#">Create a new account</a>
</p>
</footer>
</main>
</body></html>
